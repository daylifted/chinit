services:
    chinit:
        container_name: chinit_demo
        image: chinit
        build: .
        ports:
        - 1180:80
        healthcheck:
            test: ["CMD", "/bin/sh", "http://localhost/", "--grep", "RemoteAddr"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 5s
